<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Continuous corners leave a transparent margin for macOS's icon grid (824x824 inside 1024x1024). -->
    <path id="tile" d="M380 100h264c100 0 156 0 200 27 23 15 38 30 53 53 27 44 27 100 27 200v264c0 100 0 156-27 200-15 23-30 38-53 53-44 27-100 27-200 27H380c-100 0-156 0-200-27-23-15-38-30-53-53-27-44-27-100-27-200V380c0-100 0-156 27-200 15-23 30-38 53-53 44-27 100-27 200-27Z"/>
    <clipPath id="tile-clip">
      <use xlink:href="#tile"/>
    </clipPath>
    <path id="back-slab" d="M351 235H621L737 351V673A48 48 0 0 1 689 721H351A48 48 0 0 1 303 673V283A48 48 0 0 1 351 235Z"/>
    <path id="front-slab" d="M313 312H635L763 440V737A52 52 0 0 1 711 789H313A52 52 0 0 1 261 737V364A52 52 0 0 1 313 312Z"/>

    <linearGradient id="bg" x1=".18" y1="0" x2=".82" y2="1">
      <stop offset="0%" stop-color="#292B31"/>
      <stop offset="50%" stop-color="#16171B"/>
      <stop offset="100%" stop-color="#0C0D10"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".26" cy=".12" r=".72">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset="32%" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="back-fill" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0%" stop-color="#5B606E"/>
      <stop offset="100%" stop-color="#363944"/>
    </linearGradient>
    <linearGradient id="front-fill" x1=".2" y1="0" x2=".7" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="54%" stop-color="#F1F3F7"/>
      <stop offset="100%" stop-color="#D4D8E1"/>
    </linearGradient>
    <linearGradient id="slab-rim" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="slot-fill" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0%" stop-color="#111216"/>
      <stop offset="100%" stop-color="#1F2127"/>
    </linearGradient>
    <linearGradient id="signal-orange" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0%" stop-color="#FF6E40"/>
      <stop offset="100%" stop-color="#DF4518"/>
    </linearGradient>
    <linearGradient id="pin-fill" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0%" stop-color="#14161A" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#14161A" stop-opacity=".16"/>
    </linearGradient>

    <filter id="tile-shadow-ambient" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="tile-shadow-contact" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="blur-sm" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blur-md" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="blur-xs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- macOS tile elevation shadows -->
  <use xlink:href="#tile" transform="translate(0 22)" fill="#000000" opacity=".24" filter="url(#tile-shadow-ambient)"/>
  <use xlink:href="#tile" transform="translate(0 9)" fill="#000000" opacity=".22" filter="url(#tile-shadow-contact)"/>

  <!-- Clipped squircle artwork -->
  <g clip-path="url(#tile-clip)">
    <use xlink:href="#tile" fill="url(#bg)"/>
    <use xlink:href="#tile" fill="url(#sheen)"/>

    <!-- Machined side alignment ticks -->
    <line x1="180" y1="512" x2="220" y2="512" stroke="#FFFFFF" stroke-opacity=".15" stroke-width="6" stroke-linecap="round"/>
    <line x1="804" y1="512" x2="844" y2="512" stroke="#FFFFFF" stroke-opacity=".15" stroke-width="6" stroke-linecap="round"/>

    <!-- Back stacked titanium cartridge -->
    <use xlink:href="#back-slab" transform="translate(0 18)" fill="#000000" opacity=".40" filter="url(#blur-sm)"/>
    <use xlink:href="#back-slab" fill="url(#back-fill)"/>
    <use xlink:href="#back-slab" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="4"/>

    <!-- Front machined Skill Cartridge -->
    <use xlink:href="#front-slab" transform="translate(0 30)" fill="#000000" opacity=".48" filter="url(#blur-md)"/>
    <use xlink:href="#front-slab" transform="translate(0 10)" fill="#000000" opacity=".30" filter="url(#blur-xs)"/>
    <use xlink:href="#front-slab" fill="url(#front-fill)"/>
    <use xlink:href="#front-slab" fill="none" stroke="url(#slab-rim)" stroke-width="4"/>

    <!-- Dieter Rams mechanical recess + vermilion signal key -->
    <rect x="332" y="396" width="194" height="58" rx="18" fill="url(#slot-fill)"/>
    <rect x="554" y="396" width="58" height="58" rx="18" fill="url(#signal-orange)"/>
    <rect x="555.5" y="397.5" width="55" height="55" rx="16.5" fill="none" stroke="#FFB094" stroke-opacity=".45" stroke-width="2.5"/>

    <!-- Engraved parting groove -->
    <line x1="332" y1="608" x2="692" y2="608" stroke="#17181C" stroke-opacity=".12" stroke-width="6" stroke-linecap="round"/>
    <line x1="332" y1="614" x2="692" y2="614" stroke="#FFFFFF" stroke-opacity=".78" stroke-width="4" stroke-linecap="round"/>

    <!-- Symmetric recessed mount contacts -->
    <rect x="350" y="669" width="48" height="72" rx="13" fill="url(#pin-fill)"/>
    <rect x="442" y="669" width="48" height="72" rx="13" fill="url(#pin-fill)"/>
    <rect x="534" y="669" width="48" height="72" rx="13" fill="url(#pin-fill)"/>
    <rect x="626" y="669" width="48" height="72" rx="13" fill="url(#pin-fill)"/>

    <!-- Inner squircle top specular bevel -->
    <use xlink:href="#tile" fill="none" stroke="url(#rim)" stroke-width="10"/>
  </g>
</svg>
