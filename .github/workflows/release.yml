name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          # Future multi-platform expansion:
          # - platform: windows-latest
          #   target: x86_64-pc-windows-msvc
          # - platform: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure optional signing secrets
        shell: bash
        env:
          OPT_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPT_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          OPT_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          OPT_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          OPT_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          OPT_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          OPT_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          for name in \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_ID; do
            opt_var="OPT_${name}"
            val="${!opt_var}"
            if [ -n "$val" ]; then
              {
                echo "${name}<<EOF_SECRET_${name}"
                printf '%s\n' "$val"
                echo "EOF_SECRET_${name}"
              } >> "$GITHUB_ENV"
            fi
          done

      - name: Build and create GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: 'v__VERSION__'
          releaseName: 'Skill Library v__VERSION__'
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          args: '--target ${{ matrix.target }}'
