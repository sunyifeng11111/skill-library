<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Skill Library — Local AI Agent Skill Manager</title>
  <desc id="desc">Skill Library manages AI agent skills in one local library and distributes them via atomic symlinks to 57+ tools on macOS, featuring a machined cartridge hardware illustration.</desc>

  <defs>
    <radialGradient id="studio-glow" cx="0.78" cy="0.48" r="0.34">
      <stop offset="0%" stop-color="#282D3B" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#171921" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#111216" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Self-contained obsidian card -->
  <rect width="1200" height="420" rx="24" fill="#111216"/>
  <rect width="1200" height="420" rx="24" fill="url(#studio-glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="23.5" fill="none" stroke="#2A2D37"/>

  <!-- Machined side alignment ticks (from icon.svg) -->
  <line x1="20" y1="210" x2="36" y2="210" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round"/>
  <line x1="1164" y1="210" x2="1180" y2="210" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round"/>

  <!-- Left Title Block -->
  <g id="title-block" transform="translate(64 62)">
    <!-- Eyebrow with vermilion mechanical signal key -->
    <rect x="0" y="0" width="14" height="14" rx="3.5" fill="#F05524"/>
    <text x="26" y="13" fill="#9CA3B2" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="18" font-weight="600" letter-spacing="0.9">MACOS DESKTOP · TAURI 2 + RUST</text>

    <!-- Project Name -->
    <text x="0" y="96" fill="#F5F6F8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="64" font-weight="700" letter-spacing="-1.6">Skill Library</text>

    <!-- Concrete Value Proposition -->
    <text x="0" y="152" fill="#C4C9D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="400">One local library for all your AI agent skills.</text>
    <text x="0" y="186" fill="#C4C9D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="400">Collect once, organize cleanly, symlink to 57+ tools.</text>

    <!-- Factual Mechanism Pills -->
    <g id="meta-pills" transform="translate(0 238)">
      <rect x="0" y="0" width="224" height="44" rx="10" fill="#181B23" stroke="#2F3443"/>
      <circle cx="22" cy="22" r="4.5" fill="#F05524"/>
      <text x="124" y="28" text-anchor="middle" fill="#E5E7EB" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="18">57 Agent Presets</text>

      <rect x="238" y="0" width="194" height="44" rx="10" fill="#181B23" stroke="#2F3443"/>
      <text x="335" y="28" text-anchor="middle" fill="#E5E7EB" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="18">Atomic Symlinks</text>

      <rect x="446" y="0" width="152" height="44" rx="10" fill="#181B23" stroke="#2F3443"/>
      <text x="522" y="28" text-anchor="middle" fill="#E5E7EB" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="18">Local-First</text>
    </g>
  </g>

  <!-- Right Reserved Subject Slot -->
  <g id="hero-subject-slot">
    <!-- Precision corner registration marks -->
    <path d="M 744 46 V 30 H 760" fill="none" stroke="#313644" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 1126 30 H 1142 V 46" fill="none" stroke="#313644" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 744 374 V 390 H 760" fill="none" stroke="#313644" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 1126 390 H 1142 V 374" fill="none" stroke="#313644" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Grounding shadow beneath floating hardware -->
    <ellipse cx="943" cy="364" rx="132" ry="20" fill="url(#floor-shadow)"/>

    <!-- Isolated raster subject cutout -->
    <image href="./hero-subject.png" x="773" y="26" width="340" height="358" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
